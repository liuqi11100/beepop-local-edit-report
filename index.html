<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BeePop Local Edit Report</title>
<style>
:root{color-scheme:light;--bg:#f6f7f9;--panel:#fff;--text:#1f2328;--muted:#667085;--border:#d9dee7;--ok:#146c2e;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif}.wrap{max-width:1220px;margin:0 auto;padding:24px 16px 54px}
h1{margin:0 0 6px;font-size:28px}.lede{margin:0;color:var(--muted)}.panel,.case{background:var(--panel);border:1px solid var(--border);border-radius:8px}.panel{padding:12px;margin:16px 0}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.metric{border:1px solid var(--border);border-radius:8px;background:#fafbfc;padding:10px}.metric strong{display:block;font-size:22px}.metric span{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select,.toolbar button,.review button{height:34px;border:1px solid var(--border);border-radius:6px;background:#fff;padding:0 10px;color:var(--text)}
.cases{display:grid;gap:12px}.case{padding:14px}.case-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}h2{font-size:18px;margin:0 0 4px}.meta{color:var(--muted);overflow-wrap:anywhere}.badge{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:2px 8px;font-size:12px;color:var(--muted);margin-left:6px}
.review{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;border:1px solid var(--border);border-radius:8px;background:#fafbfc;padding:8px}.review .pass.active{background:#e7f5ea;border-color:var(--ok);color:var(--ok);font-weight:700}.review .fail.active{background:#fdecec;border-color:var(--bad);color:var(--bad);font-weight:700}.case.pass{border-color:var(--ok)}.case.fail{border-color:var(--bad)}
.detail{margin-top:12px;display:none}.case.open .detail{display:grid;gap:12px}.compare{position:relative;height:min(64vh,640px);min-height:340px;background:#111;border-radius:8px;overflow:hidden}.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.compare .after{clip-path:inset(0 0 0 50%)}.compare input{position:absolute;left:14px;right:14px;bottom:14px;width:calc(100% - 28px);accent-color:#fff}.handle{position:absolute;inset-block:0;left:50%;width:1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.45);pointer-events:none}.tag{position:absolute;top:10px;padding:4px 8px;background:rgba(0,0,0,.68);color:#fff;border-radius:6px;font-size:12px}.tag.right{right:10px}.tag.left{left:10px}
details{border:1px solid var(--border);border-radius:8px;background:#fbfcfd;padding:10px}summary{cursor:pointer;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto;background:#111;color:#f5f5f5;border-radius:8px;padding:12px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.empty{padding:22px;text-align:center;color:var(--muted)}
@media(max-width:720px){.case-head{grid-template-columns:1fr}.wrap{padding:18px 12px}.compare{height:60vh;min-height:300px}}
</style>
</head>
<body>
<main class="wrap">
<h1>BeePop &#x5c40;&#x90e8;&#x7f16;&#x8f91;&#x6279;&#x91cf;&#x6d4b;&#x8bd5;&#x62a5;&#x544a;</h1>
<p class="lede" id="lede">&#x6b63;&#x5728;&#x52a0;&#x8f7d;&#x62a5;&#x544a;&#x6570;&#x636e;...</p>
<section class="panel summary" id="summary"></section>
<section class="panel"><div class="toolbar">
<input id="q" type="search" placeholder="&#x641c;&#x7d22;&#x6848;&#x4f8b;&#x7f16;&#x53f7;&#x6216;&#x6307;&#x4ee4;">
<select id="mode"><option value="">&#x5168;&#x90e8;&#x7c7b;&#x578b;</option><option value="annotation_guided_edit">&#x6ce8;&#x91ca;&#x6027;&#x7f16;&#x8f91;</option><option value="single_image_edit">&#x5355;&#x56fe;&#x7f16;&#x8f91;</option></select>
<select id="reviewFilter"><option value="">&#x5168;&#x90e8;&#x590d;&#x6838;</option><option value="pass">&#x5224;&#x5bf9;</option><option value="fail">&#x5224;&#x9519;</option><option value="unreviewed">&#x672a;&#x590d;&#x6838;</option></select>
<button id="exportReview" type="button">&#x5bfc;&#x51fa;&#x6807;&#x8bb0; JSON</button><button id="importReview" type="button">&#x5bfc;&#x5165;&#x6807;&#x8bb0; JSON</button><span id="count"></span>
</div></section>
<section class="cases" id="cases"><div class="empty">Loading...</div></section>
</main>
<script src="report-data.js"></script>
<script>
const L={"title":"\u5c40\u90e8\u7f16\u8f91\u6279\u91cf\u6d4b\u8bd5\u62a5\u544a","loading":"\u6b63\u5728\u52a0\u8f7d\u62a5\u544a\u6570\u636e...","subtitle":"\u8f7b\u91cf\u9884\u89c8\u7248 \u00b7 \u56fe\u7247\u548c Prompt \u6309\u9700\u52a0\u8f7d","search":"\u641c\u7d22\u6848\u4f8b\u7f16\u53f7\u6216\u6307\u4ee4","allTypes":"\u5168\u90e8\u7c7b\u578b","annotation":"\u6ce8\u91ca\u6027\u7f16\u8f91","single":"\u5355\u56fe\u7f16\u8f91","allReview":"\u5168\u90e8\u590d\u6838","pass":"\u5224\u5bf9","fail":"\u5224\u9519","unreviewed":"\u672a\u590d\u6838","exportMarks":"\u5bfc\u51fa\u6807\u8bb0 JSON","importMarks":"\u5bfc\u5165\u6807\u8bb0 JSON","total":"\u603b\u6848\u4f8b","generated":"\u751f\u6210\u6210\u529f","manualSuccess":"\u4eba\u5de5\u6210\u529f\u7387","manualError":"\u4eba\u5de5\u9519\u8bef\u7387","reviewed":"\u5df2\u590d\u6838","passFail":"\u5224\u5bf9 / \u5224\u9519","shown":"\u663e\u793a","noMatch":"\u6ca1\u6709\u5339\u914d\u6848\u4f8b","open":"\u6253\u5f00\u8be6\u60c5","review":"\u4eba\u5de5\u590d\u6838","note":"\u672a\u6807\u8bb0\u4e0d\u53c2\u4e0e\u6210\u529f\u7387","finalPrompt":"\u6700\u7ec8 Prompt","loadFailedPrefix":"\u52a0\u8f7d report-data.js \u5931\u8d25\u3002\u8bf7\u786e\u8ba4 index.html \u4e0e report-data.js \u5728\u540c\u4e00\u76ee\u5f55\u3002\u9519\u8bef\uff1a"};
const els={lede:document.getElementById('lede'),summary:document.getElementById('summary'),cases:document.getElementById('cases'),q:document.getElementById('q'),mode:document.getElementById('mode'),reviewFilter:document.getElementById('reviewFilter'),count:document.getElementById('count')};
let report=null,rows=[],marks={};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(n,d)=>d?Math.round(n*1000/d)/10+'%':'0%';
function promptOf(c){return c.steps?.image_generation?.refs?.image_generation_prompt||c.steps?.main_agent?.refs?.final_prompt||c.prompt_health?.critical_fields?.find(f=>f.field_id==='final_prompt')?.value||''}
function mediaOf(c,kind){return (c.media||[]).find(m=>kind==='generated'?m.kind==='generated':m.kind==='input')||null}
function storageKey(){return 'beepop-review-v2:'+(report?.run_id||location.pathname)}
function loadMarks(){try{marks=JSON.parse(localStorage.getItem(storageKey())||'{}')}catch{marks={}}}
function saveMarks(){localStorage.setItem(storageKey(),JSON.stringify(marks))}
function load(){try{report=window.BEEPOP_REPORT_DATA;if(!report)throw new Error('report-data.js missing');rows=report.cases||[];loadMarks();renderAll()}catch(e){els.lede.textContent=L.loadFailedPrefix+e.message;els.cases.innerHTML=''}}
function renderSummary(){const s=report.summary||{};let pass=0,fail=0;rows.forEach(c=>{if(marks[c.case_id]==='pass')pass++;if(marks[c.case_id]==='fail')fail++});const reviewed=pass+fail;els.lede.textContent=(report.run_id||'')+' \u00b7 '+L.subtitle;els.summary.innerHTML=[[L.total,s.total_cases||rows.length],[L.generated,s.generated_cases||0],[L.annotation,s.annotation_cases||0],[L.single,s.single_image_cases||0],[L.manualSuccess,pct(pass,reviewed)],[L.manualError,pct(fail,reviewed)],[L.reviewed,reviewed+' / '+rows.length],[L.passFail,pass+' / '+fail]].map(([k,v])=>'<div class="metric"><strong>'+esc(v)+'</strong><span>'+esc(k)+'</span></div>').join('')}
function filtered(){const q=els.q.value.trim().toLowerCase(),m=els.mode.value,rf=els.reviewFilter.value;return rows.filter(c=>{const rv=marks[c.case_id]||'';return(!m||c.selected_mode===m)&&(!rf||(rf==='unreviewed'?!rv:rv===rf))&&(!q||[c.case_id,c.title,c.recomposition_requirement,c.selected_mode_label].join(' ').toLowerCase().includes(q))})}
function renderAll(){renderSummary();const data=filtered();els.count.textContent=L.shown+' '+data.length+' / '+rows.length;els.cases.innerHTML=data.map(card).join('')||'<div class="empty">'+L.noMatch+'</div>'}
function card(c){const rv=marks[c.case_id]||'';return '<article class="case '+esc(rv)+'" data-id="'+esc(c.case_id)+'"><div class="case-head"><div><h2>'+esc(c.case_id)+'<span class="badge">'+esc(c.selected_mode_label||c.selected_mode)+'</span><span class="badge">'+esc(c.status)+'</span></h2><div class="meta">'+esc(c.title||c.recomposition_requirement||'')+'</div></div><button type="button" data-action="toggle">'+L.open+'</button></div><div class="review"><strong>'+L.review+'</strong><button class="pass '+(rv==='pass'?'active':'')+'" data-action="mark" data-value="pass" type="button">'+L.pass+'</button><button class="fail '+(rv==='fail'?'active':'')+'" data-action="mark" data-value="fail" type="button">'+L.fail+'</button><span class="meta">'+L.note+'</span></div><div class="detail"></div></article>'}
function updateCardReview(card,value){card.classList.toggle('pass',value==='pass');card.classList.toggle('fail',value==='fail');card.querySelectorAll('button[data-action="mark"]').forEach(btn=>{btn.classList.toggle('active',btn.dataset.value===value)})}
function openCase(card){const id=card.dataset.id,c=rows.find(x=>x.case_id===id);if(!c)return;card.classList.add('open');const btn=card.querySelector('button[data-action="toggle"]');if(btn)btn.hidden=true;const box=card.querySelector('.detail');if(box.dataset.loaded)return;const input=mediaOf(c,'input'),gen=mediaOf(c,'generated'),prompt=promptOf(c);box.innerHTML='<div class="compare" data-compare><img class="before" loading="lazy" src="'+esc(input?.path||'')+'" alt=""><img class="after" loading="lazy" src="'+esc(gen?.path||'')+'" alt=""><span class="tag left">'+esc(input?.label||'Input')+'</span><span class="tag right">Generated</span><span class="handle"></span><input type="range" min="0" max="100" value="50"></div><details><summary>'+L.finalPrompt+'</summary><pre>'+esc(prompt)+'</pre></details>';box.dataset.loaded='1';const comp=box.querySelector('[data-compare]'),range=comp.querySelector('input'),after=comp.querySelector('.after'),handle=comp.querySelector('.handle');range.addEventListener('input',()=>{after.style.clipPath='inset(0 0 0 '+range.value+'%)';handle.style.left=range.value+'%'})}
els.cases.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;const card=e.target.closest('.case');if(!card)return;if(btn.dataset.action==='toggle')openCase(card);if(btn.dataset.action==='mark'){marks[card.dataset.id]=btn.dataset.value;saveMarks();updateCardReview(card,btn.dataset.value);renderSummary()}});
[els.q,els.mode,els.reviewFilter].forEach(el=>el.addEventListener('input',renderAll));els.mode.addEventListener('change',renderAll);els.reviewFilter.addEventListener('change',renderAll);
document.getElementById('exportReview').onclick=()=>{const blob=new Blob([JSON.stringify({runId:report?.run_id||'',updatedAt:new Date().toISOString(),marks},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='beepop-review-marks.json';a.click();URL.revokeObjectURL(a.href)};
document.getElementById('importReview').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='application/json';i.onchange=async()=>{const f=i.files&&i.files[0];if(!f)return;const data=JSON.parse(await f.text());marks=data.marks||data||{};saveMarks();renderAll()};i.click()};
load();
</script>
</body>
</html>
